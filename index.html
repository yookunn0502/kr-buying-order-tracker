<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>cloverxbunny｜韓國代購查詢</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-100 text-stone-700 min-h-screen">

  <div class="max-w-3xl mx-auto px-5 py-10">

    <!-- Header -->
    <div class="text-center mb-12">

      <div class="text-sm tracking-[6px] text-stone-400 mb-3">
        9月代購訂單查詢
      </div>

      <h1 class="text-5xl font-light mb-4">
        cloverxbunny
      </h1>

      <p class="text-stone-400 text-sm">
        韓國代購訂單查詢
      </p>

    </div>

    <!-- Search -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-stone-200">

      <div class="flex flex-col md:flex-row gap-4">

        <input
          id="searchInput"
          type="text"
          placeholder="請輸入threads帳號名稱"
          class="flex-1 bg-stone-50 border border-stone-200 rounded-2xl px-5 py-4 outline-none"
        >

        <button
          onclick="searchOrder()"
          class="bg-stone-700 hover:bg-stone-800 text-white px-8 py-4 rounded-2xl transition"
        >
          查詢訂單
        </button>

      </div>

    </div>

    <!-- Result -->
    <div id="result" class="mt-8"></div>
<!-- Notice -->
<div class="bg-white rounded-3xl p-8 shadow-sm border border-stone-200 mt-10">

  <h2 class="text-2xl mb-6 font-light text-stone-700">
    購買須知
  </h2>

  <div class="space-y-4 text-stone-500 leading-8">

    <div>
      ・商品為九月連線代購，預計9/26後三天內寄出
    </div>

    <div>
      ・下單後不接受取消與退款
    </div>

    <div>
      ・喊單後請於一天內匯款，需完成付款才會安排下單
    </div>

  </div>

</div>

    <!-- Footer -->
    <div class="text-center mt-16 text-sm text-stone-400 leading-7">
      <div>
        thank you for your order ♡
      </div>

    </div>

  </div>

  <script>

    const API_URL = "https://opensheet.elk.sh/1sb_Q8fGORDpMM82g2GJGmMBDKyhIGJb0AJmpOo21TtM/工作表1";

    let orders = [];

    async function loadOrders() {

      try {

        const response = await fetch(API_URL);

        const data = await response.json();

        orders = data;

      } catch (error) {

        console.log(error);

      }

    }

    async function searchOrder() {

      if (orders.length === 0) {

        await loadOrders();

      }

      const input = document
        .getElementById("searchInput")
        .value
        .trim();

      const result = document.getElementById("result");

      const customerOrders = orders.filter(
        item => item.Name === input
      );

      if (customerOrders.length === 0) {

        result.innerHTML = `
          <div class="bg-white rounded-3xl p-8 shadow-sm border border-stone-200 text-center">
            查無訂單資料
          </div>
        `;

        return;

      }

      let html = `
        <div class="bg-white rounded-3xl p-8 shadow-sm border border-stone-200">

          <h2 class="text-2xl mb-8 font-light">
            ${input} 的訂單
          </h2>
      `;

      customerOrders.forEach(item => {

        let color = "bg-amber-100 text-amber-700";

        if (item.Status === "已匯款") {
          color = "bg-green-100 text-green-700";
        }

        if (item.Status === "待出貨") {
          color = "bg-blue-100 text-blue-700";
        }

        html += `
          <div class="border border-stone-100 rounded-2xl p-5 mb-4 flex justify-between items-center bg-stone-50">

            <div>
              ${item.Product}
            </div>

            <div class="${color} px-4 py-2 rounded-full text-sm">
              ${item.Status}
            </div>

          </div>
        `;
      });

      html += `</div>`;

      result.innerHTML = html;

    }

  </script>

</body>

</html>
